kind: Pod
apiVersion: v1
metadata:
  name: pvc-consumer
  namespace: volumes
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sh", "-c", "while true; do echo writing; echo hello >> /data/out.txt; sleep 5; done"]
    volumeMounts:
    - name: storage
      mountPath: /data
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: myclaim
