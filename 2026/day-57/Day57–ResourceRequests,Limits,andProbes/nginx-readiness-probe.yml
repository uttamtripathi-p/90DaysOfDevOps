kind: Pod
apiVersion: v1
metadata:
  name: nginx
  labels:
    app: nginx-readiness
spec:
  containers:
    - name: nginx
      image: nginx:1.25.5
      ports:
        - containerPort: 80
          name: http
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "250m"  
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3
        successThreshold: 1
